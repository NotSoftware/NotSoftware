<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .card { fill:#0d1117; stroke:#30363d; stroke-width:1; rx:12; }
      .title { fill:#58a6ff; font-size:17px; font-weight:700; }
      .label { fill:#c9d1d9; font-size:15px; }
      .value { fill:#ffffff; font-size:15px; font-weight:700; }
      .lang-name { fill:#c9d1d9; font-size:14px; font-weight:600; }
      .lang-pct { fill:#8b949e; font-size:14px; }
      .header { fill:#e6edf3; font-size:22px; font-weight:700; }
    </style>
  </defs>

  <rect width="1000" height="320" fill="#010409"/>

  <!-- Header -->
  <text x="6" y="34" font-size="26">🐾</text>
  <text x="42" y="34" class="header">GitHub Stats</text>

  <!-- Left card -->
  <rect x="0" y="60" width="470" height="255" rx="12" class="card"/>
  <text x="24" y="96" class="title">— RedHarlowCore —'s GitHub Statistics</text>

  <text x="24" y="136" font-size="16">⭐</text>
  <text x="52" y="136" class="label">Stars</text>
  <text x="440" y="136" text-anchor="end" class="value">312</text>

  <text x="24" y="166" font-size="16">🍴</text>
  <text x="52" y="166" class="label">Forks</text>
  <text x="440" y="166" text-anchor="end" class="value">57</text>

  <text x="24" y="196" font-size="16">📥</text>
  <text x="52" y="196" class="label">All-time contributions</text>
  <text x="440" y="196" text-anchor="end" class="value">4,918</text>

  <text x="24" y="226" font-size="16">➕</text>
  <text x="52" y="226" class="label">Lines of code changed</text>
  <text x="440" y="226" text-anchor="end" class="value">21,340,712</text>

  <text x="24" y="256" font-size="16">👁️</text>
  <text x="52" y="256" class="label">Repository views (past two weeks)</text>
  <text x="440" y="256" text-anchor="end" class="value">6,742</text>

  <text x="24" y="286" font-size="16">📦</text>
  <text x="52" y="286" class="label">Repositories with contributions</text>
  <text x="440" y="286" text-anchor="end" class="value">142</text>

  <!-- Right card -->
  <rect x="510" y="60" width="490" height="255" rx="12" class="card"/>
  <text x="534" y="96" class="title" fill="#e6edf3">Languages Used (By File Size)</text>

  <!-- Stacked bar -->
  <g transform="translate(534,116)">
    <rect x="0"   y="0" width="294" height="10" rx="5" fill="#f34b7d"/>
    <rect x="294" y="0" width="175" height="10" fill="#555555"/>
    <rect x="469" y="0" width="105" height="10" fill="#3572A5"/>
    <rect x="574" y="0" width="70"  height="10" fill="#6E4C13"/>
    <rect x="644" y="0" width="28"  height="10" fill="#17becf"/>
    <rect x="672" y="0" width="28"  height="10" rx="5" fill="#89e051"/>
  </g>

  <!-- Legend row 1 -->
  <circle cx="540" cy="152" r="5" fill="#f34b7d"/>
  <text x="552" y="157" class="lang-name">C++ <tspan class="lang-pct">42.30%</tspan></text>

  <circle cx="700" cy="152" r="5" fill="#555555"/>
  <text x="712" y="157" class="lang-name">C <tspan class="lang-pct">25.10%</tspan></text>

  <circle cx="840" cy="152" r="5" fill="#3572A5"/>
  <text x="852" y="157" class="lang-name">Python <tspan class="lang-pct">15.60%</tspan></text>

  <!-- Legend row 2 -->
  <circle cx="540" cy="182" r="5" fill="#6E4C13"/>
  <text x="552" y="187" class="lang-name">Assembly <tspan class="lang-pct">10.20%</tspan></text>

  <circle cx="700" cy="182" r="5" fill="#17becf"/>
  <text x="712" y="187" class="lang-name">YARA <tspan class="lang-pct">4.10%</tspan></text>

  <circle cx="840" cy="182" r="5" fill="#89e051"/>
  <text x="852" y="187" class="lang-name">Shell <tspan class="lang-pct">2.70%</tspan></text>

  <!-- footer note -->
  <text x="534" y="290" font-size="11" fill="#484f58">Static snapshot — update numbers manually or wire to a live stats API</text>
</svg>
